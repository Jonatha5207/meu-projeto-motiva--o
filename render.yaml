databases:
  - name: companheiro-db
    plan: free
    databaseName: companheiro
    user: companheiro

services:
  - type: web
    name: companheiro-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: companheiro-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
